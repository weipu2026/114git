name: 部署 114Git

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 改完 GitHub 配置后，可在此手动触发部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 部署到 Cloudflare Workers
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 校验必填配置
        run: |
          # PASSWORD / TOKEN_KEY / DOMAIN 为必填
          if [ -z "$PASSWORD" ] || [ -z "$TOKEN_KEY" ] || [ -z "$DOMAIN" ]; then
            echo "::error::必填配置缺失：PASSWORD / TOKEN_KEY / DOMAIN 三个 GitHub Secret 都必须配置。"
            exit 1
          fi
          # ALLOW_MASTER_KEY 必须二选一（true 开 / false 关），留空会导致 wrangler-action 部署失败
          if [ "$ALLOW_MASTER_KEY" != "true" ] && [ "$ALLOW_MASTER_KEY" != "false" ]; then
            echo "::error::ALLOW_MASTER_KEY 必须配置为 true 或 false（当前值：'$ALLOW_MASTER_KEY'）。"
            exit 1
          fi
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          ALLOW_MASTER_KEY: ${{ secrets.ALLOW_MASTER_KEY }}

      - name: 部署并同步机密
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 每次部署自动把下面列出的 GitHub Secret 写入 Worker 机密（wrangler secret put）
          # 必填四件套：PASSWORD / TOKEN_KEY / DOMAIN / ALLOW_MASTER_KEY（上一步校验已强制其非空且 true|false）
          secrets: |
            PASSWORD
            TOKEN_KEY
            DOMAIN
            ALLOW_MASTER_KEY
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
          ALLOW_MASTER_KEY: ${{ secrets.ALLOW_MASTER_KEY }}